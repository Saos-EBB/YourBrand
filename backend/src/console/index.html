<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandanten-Console</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1a1d23; --muted: #646b78; --line: #e2e5ea; --grid: #eef0f3;
    --ok: #1f9d55; --off: #9aa1ad; --bad: #c62828; --bad-bg: #fdecea; --series: #2a78d6;
    --viz-1: #2a78d6; --viz-2: #eb6834; --viz-3: #1baf7a; --viz-4: #eda100; --viz-5: #e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa1ad; --line: #2b313c; --grid: #252a33;
      --ok: #4ade80; --off: #6b7280; --bad: #f87171; --bad-bg: #3b1d1d; --series: #3987e5;
      --viz-1: #3987e5; --viz-2: #d95926; --viz-3: #199e70; --viz-4: #c98500; --viz-5: #d55181;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 20px 24px 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 24px 0 8px; }
  .muted { color: var(--muted); }
  .spacer { flex: 1; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  main { padding: 8px 24px 40px; }
  a { color: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  a.card { text-decoration: none; }
  a.card:hover { border-color: var(--muted); }
  .head { display: flex; align-items: center; gap: 10px; }
  .mark { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; }
  .name { font-weight: 600; font-size: 15px; }
  .status { margin-left: auto; font-size: 12px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .dot.up { background: var(--ok); }
  .swatches { display: flex; gap: 4px; min-height: 18px; align-items: center; }
  .swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); }
  .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px; font-size: 12px; white-space: pre-wrap; }
  .kpis { display: flex; gap: 14px; flex-wrap: wrap; }
  .kpis b { font-size: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; }
  .tile .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .delta { font-size: 12px; color: var(--muted); }
  button.tile[aria-pressed="true"] { border-color: var(--series); box-shadow: inset 0 0 0 1px var(--series); }
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: relative; }
  .chart svg { display: block; width: 100%; height: 220px; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; max-width: 760px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; display: grid; gap: 8px; }
  legend { color: var(--muted); font-size: 12px; padding: 0 4px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .row label { display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 14px; }
  input[type=text], select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.primary { background: var(--series); border-color: var(--series); color: #fff; }
  pre.diff { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; margin: 0; }
  .add { color: var(--ok); } .del { color: var(--bad); }
  .note { font-size: 13px; }
  .tokens { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 6px 16px; }
  .token { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .token code { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .token.set code { color: var(--text); font-weight: 600; }
  .token input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
  .token input[type=text] { width: 86px; padding: 3px 6px; font-family: ui-monospace, monospace; font-size: 12px; }
  .token button { padding: 2px 8px; font-size: 12px; }
  .previews { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .pv { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--color-background); color: var(--color-on-surface); font-size: 13px; }
  .pv-nav { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--color-surface-container-low); }
  .pv-nav b { color: var(--color-primary-fixed-dim); }
  .pv-nav .active { color: var(--color-primary-fixed-dim); border-bottom: 2px solid var(--color-primary-fixed-dim); }
  .pv-nav .muted2 { color: var(--color-on-surface-variant); }
  .pv-badge { margin-left: auto; background: var(--color-primary-fixed-dim); color: var(--color-on-primary-container); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 700; box-shadow: 0 0 10px var(--color-nav-badge-glow); }
  .pv-body { padding: 12px; display: grid; gap: 10px; }
  .pv-card { background: var(--color-surface-container-high); border: 1px solid var(--color-outline-variant); border-radius: 8px; padding: 10px; display: grid; gap: 6px; }
  .pv-card small { color: var(--color-on-surface-variant); }
  .pv-tert { color: var(--color-tertiary-fixed-dim); font-weight: 600; }
  .pv-btns { display: flex; gap: 8px; }
  .pv-btn { background: var(--color-primary-fixed-dim); color: var(--color-on-primary-container); border-radius: 8px; padding: 6px 12px; font-weight: 600; }
  .pv-btn2 { border: 1px solid var(--color-primary-fixed-dim); color: var(--color-primary-fixed-dim); border-radius: 8px; padding: 6px 12px; }
  .pv-bubbles { display: grid; gap: 4px; }
  .pv-in { justify-self: start; background: var(--color-primary-fixed-dim); color: var(--color-background); border-radius: 10px; padding: 4px 10px; }
  .pv-out { justify-self: end; background: var(--color-surface-container); color: var(--color-on-surface); border-radius: 10px; padding: 4px 10px; }
  .contrast { font-size: 12px; display: grid; gap: 2px; padding: 8px 12px; background: var(--card); color: var(--text); border-top: 1px solid var(--line); }
  .contrast .warn { color: var(--bad); }
  .mark img { width: 100%; height: 100%; object-fit: contain; }
  .mark.has-logo { background: transparent !important; border: 1px solid var(--line); }
  .logo-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .logo-bg { width: 120px; height: 56px; border-radius: 8px; padding: 6px; border: 1px solid var(--line); }
  .logo-bg img { width: 100%; height: 100%; object-fit: contain; }
  .drop { flex: 1; min-width: 200px; border: 2px dashed var(--line); border-radius: 8px; padding: 12px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--series); color: var(--text); }
  .tooltip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  /* ── Analytics ── */
  .an { display: grid; gap: 12px; transition: opacity .2s; }
  .an.loading { opacity: .5; }
  .an-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 24px 0 4px; }
  .an-bar h2 { margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--card); }
  .seg button { border: 0; padding: 4px 10px; font-size: 12px; color: var(--muted); background: none; border-radius: 6px; }
  .seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--bg); color: var(--text); font-weight: 600; }
  .an-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .row2 { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .kpi .value { font-size: 28px; font-weight: 600; line-height: 1; }
  .kpi .delta { font-size: 12px; color: var(--muted); }
  .kpi .delta b { color: var(--text); }
  .kpi .up { color: var(--ok); } .kpi .down { color: var(--bad); }
  .an-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
  .an-grid .wide { grid-column: 1 / -1; }
  .viz { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; position: relative; }
  .viz header { padding: 0; display: flex; align-items: flex-start; gap: 12px; }
  .viz h3 { margin: 0; font-size: 14px; }
  .viz .sub { font-size: 12px; color: var(--muted); }
  .viz .big { margin-left: auto; font-size: 20px; font-weight: 600; }
  .viz .tbl { border: 0; background: none; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; }
  .viz .plot { position: relative; }
  .viz svg { display: block; }
  .viz svg text { fill: var(--muted); font-size: 10px; }
  .viz svg text.strong { fill: var(--text); font-size: 12px; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); list-style: none; margin: 0; padding: 0; }
  .legend li { display: flex; align-items: center; gap: 6px; }
  .legend b { color: var(--text); font-variant-numeric: tabular-nums; }
  .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .tip { position: absolute; pointer-events: none; z-index: 2; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); min-width: 140px; display: none; }
  .tip .t { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .tip div.r { display: flex; align-items: center; gap: 6px; }
  .tip div.r b { font-variant-numeric: tabular-nums; }
  .tip .ln { width: 12px; height: 2px; border-radius: 2px; }
  .funnel { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .funnel .fl { display: flex; gap: 8px; font-size: 12px; align-items: baseline; }
  .funnel .fl span:first-child { flex: 1; color: var(--muted); }
  .funnel .fl small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .track { height: 18px; border-radius: 5px; background: var(--grid); overflow: hidden; }
  .track > div { height: 100%; border-radius: 0 5px 5px 0; }
  .bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .bars li { display: grid; grid-template-columns: minmax(0, 8rem) 1fr 4.5rem; gap: 10px; align-items: center; font-size: 12px; }
  .bars li > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .bars li b { text-align: right; font-variant-numeric: tabular-nums; }
  .bars .track { height: 8px; border-radius: 4px; }
  .bars .track > div { border-radius: 4px; }
  .split { display: flex; gap: 2px; height: 12px; }
  .split div:first-child { border-radius: 6px 0 0 6px; } .split div:last-child { border-radius: 0 6px 6px 0; }
  table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data th { text-align: right; color: var(--muted); font-weight: 500; padding: 6px 8px; position: sticky; top: 0; background: var(--card); }
  table.data td { text-align: right; padding: 4px 8px; border-top: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  .tblwrap { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .heatlegend { display: flex; gap: 6px; align-items: center; justify-content: flex-end; font-size: 11px; color: var(--muted); }
  .heatlegend span.c { width: 16px; height: 10px; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1><a href="#/" style="text-decoration:none">Mandanten-Console</a></h1>
  <span class="muted" id="summary"></span>
  <span class="spacer"></span>
  <span class="muted" id="stamp"></span>
  <button id="refresh">Aktualisieren</button>
</header>
<main id="view"></main>
<script>

// Felder von AdminDashboardStatsDto, gruppiert fuer die Detailseite
const GROUPS = [
  ['Nutzer', { totalUsers: 'User gesamt', activeUsers: 'Aktiv (verifiziert)', onlineUsers: 'Online (15 min)', newUsersToday: 'Neu heute', newUsersThisWeek: 'Neu diese Woche', bannedUsers: 'Gesperrt' }],
  ['Aktivität', { messagesToday: 'Nachrichten heute', messagesThisWeek: 'Nachrichten Woche', contactRequestsToday: 'Anfragen heute', contactRequestsThisWeek: 'Anfragen Woche' }],
  ['Umsatz', { activeSubscriptions: 'Aktive Abos', totalRevenue: 'Umsatz gesamt' }],
  ['Moderation', { openReports: 'Offene Reports', openTickets: 'Offene Tickets', strikesThisWeek: 'Strikes Woche', pendingMedia: 'Medien in Prüfung' }],
];
const LABELS = Object.assign({}, ...GROUPS.map(([, g]) => g));
const TOTALS = ['totalUsers', 'onlineUsers', 'activeSubscriptions', 'totalRevenue', 'openReports', 'openTickets'];

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmt = (key, v) => key === 'totalRevenue'
  ? v.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' })
  : v.toLocaleString('de-DE');
const fmtTime = (iso) => new Date(iso).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' });

let tenants = [];
let snapshots = [];
let selected = 'totalUsers';

const history = (slug) => snapshots.filter((s) => s.slug === slug);
const latest = (slug) => history(slug).at(-1);

function statusLabel(t) {
  if (t.running === null) return '<span class="dot"></span>Docker?';
  return t.running ? '<span class="dot up"></span>läuft' : '<span class="dot"></span>aus';
}

function card(t) {
  const c = t.config;
  // Farben im Standard-Modus des Mandanten: gemeinsame + Modus-Tokens
  const tokens = { ...(c.theme?.tokens ?? {}), ...(c.theme?.[c.theme?.default] ?? {}) };
  const primary = tokens['--color-primary-fixed-dim'] ?? meta.baseTokens.dark['--color-primary-fixed-dim'];
  const swatches = Object.entries(tokens)
    .map(([k, v]) => `<span class="swatch" style="background:${esc(v)}" title="${esc(k)}: ${esc(v)}"></span>`)
    .join('') || '<span class="muted">Standardfarben</span>';
  const name = c.brand?.name ?? t.slug;
  const snap = latest(t.slug);
  const kpis = !snap ? '<span class="muted">noch keine Stats — Aktualisieren</span>'
    : !snap.stats ? `<span class="muted">Stats nicht abrufbar</span>`
    : `<div class="kpis">
        <span><b>${fmt('totalUsers', snap.stats.totalUsers)}</b> <span class="muted">User</span></span>
        <span><b>${fmt('onlineUsers', snap.stats.onlineUsers)}</b> <span class="muted">online</span></span>
        <span><b>${fmt('openReports', snap.stats.openReports)}</b> <span class="muted">Reports</span></span>
      </div>`;
  return `
    <a class="card" href="#/t/${encodeURIComponent(t.slug)}">
      <div class="head">
        ${c.brand?.logo
          ? `<div class="mark has-logo"><img src="${assetUrl(t.slug, c.brand.logo)}" alt=""></div>`
          : `<div class="mark" style="background:${esc(primary)}">${esc(name[0])}</div>`}
        <div>
          <div class="name">${esc(name)}</div>
          <div class="muted">${esc(t.slug)} · ${esc(c.tier)} · ${esc(c.theme?.default)}</div>
        </div>
        <div class="status">${statusLabel(t)}</div>
      </div>
      <div class="swatches">${swatches}</div>
      ${kpis}
      ${t.error ? `<div class="error">${esc(t.error)}</div>` : ''}
    </a>`;
}

function tile(key, value, previous, pressed) {
  const delta = previous === undefined || previous === value ? ''
    : `${value > previous ? '+' : '−'}${fmt(key, Math.abs(value - previous))} seit letztem Stand`;
  const tag = pressed === undefined ? 'div' : 'button';
  const attr = pressed === undefined ? '' : ` data-key="${key}" aria-pressed="${pressed}"`;
  return `<${tag} class="tile"${attr}>
      <div class="label">${esc(LABELS[key])}</div>
      <div class="value">${fmt(key, value)}</div>
      <div class="delta">${delta || '&nbsp;'}</div>
    </${tag}>`;
}

function renderOverview() {
  // Summe nur ueber den letzten gemeinsamen Stand, sonst mischen sich Zeitpunkte
  const lastAt = snapshots.at(-1)?.at;
  const batch = snapshots.filter((s) => s.at === lastAt && s.stats);
  const totals = !batch.length ? '' : `
    <h2>Alle Mandanten · ${batch.length} von ${tenants.length} mit Stats</h2>
    <div class="tiles">${TOTALS.map((k) => tile(k, batch.reduce((sum, s) => sum + s.stats[k], 0))).join('')}</div>`;
  return `${totals}<div id="an-root" class="an" data-key="*"></div><h2>Mandanten</h2><div class="grid">${tenants.map(card).join('')}</div>`;
}

function renderDetail(slug) {
  const t = tenants.find((x) => x.slug === slug);
  if (!t) return `<p>Mandant „${esc(slug)}“ nicht gefunden. <a href="#/">Zurück</a></p>`;
  const rows = history(slug).filter((s) => s.stats);
  const last = latest(slug);
  const head = `<p class="actions"><a href="#/">← Übersicht</a><span class="spacer"></span><a href="#/t/${encodeURIComponent(slug)}/edit"><button>Bearbeiten</button></a></p>
    ${card(t).replace('<a class="card"', '<div class="card"').replace(/<\/a>\s*$/, '</div>')}`;
  const an = `<div id="an-root" class="an" data-key="${esc(slug)}"></div>`;
  if (!last) return `${head}${an}<p class="muted">Noch keine Snapshots — oben „Aktualisieren“.</p>`;
  if (!last.stats) return `${head}${an}<div class="error">Letzter Stand (${fmtTime(last.at)}): ${esc(last.error)}</div>`;
  const prev = rows.at(-2)?.stats;
  const groups = GROUPS.map(([title, g]) => `<h2>${title}</h2><div class="tiles">${
    Object.keys(g).map((k) => tile(k, last.stats[k], prev?.[k], k === selected)).join('')
  }</div>`).join('');
  return `${head}${an}<h2>Snapshots</h2>${groups}<h2>Verlauf: ${esc(LABELS[selected])}</h2>
    <div class="chart" id="chart"><svg></svg><div class="tooltip"></div></div>`;
}

function drawChart(slug) {
  const box = document.getElementById('chart');
  if (!box) return;
  const points = history(slug).filter((s) => s.stats).map((s) => ({ at: s.at, v: s.stats[selected] }));
  const svg = box.querySelector('svg');
  const tip = box.querySelector('.tooltip');
  const W = svg.clientWidth, H = 220, L = 48, R = 12, T = 10, B = 24;
  if (points.length < 2) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">Mindestens zwei Stände nötig — öfter aktualisieren.</text>`;
    return;
  }
  const max = Math.max(...points.map((p) => p.v)) || 1;
  const x = (i) => L + (i / (points.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - v / max) * (H - T - B);
  const ticks = [0, max / 2, max];
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/>
      <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(selected, Math.round(v))}</text>`).join('')}
    <text x="${L}" y="${H - 6}">${fmtTime(points[0].at)}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtTime(points.at(-1).at)}</text>
    <polyline fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round"
      points="${points.map((p, i) => `${x(i)},${y(p.v)}`).join(' ')}"/>
    ${points.length <= 40 ? points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--series)" stroke="var(--card)" stroke-width="2"/>`).join('') : ''}
    <line id="cross" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
  const cross = svg.querySelector('#cross');
  svg.onmousemove = (e) => {
    const px = e.clientX - svg.getBoundingClientRect().left;
    const i = Math.max(0, Math.min(points.length - 1, Math.round(((px - L) / (W - L - R)) * (points.length - 1))));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = `${fmtTime(points[i].at)}<br><b>${fmt(selected, points[i].v)}</b>`;
    tip.style.display = 'block';
    tip.style.left = `${Math.min(x(i) + 24, W - 100)}px`;
    tip.style.top = `${y(points[i].v)}px`;
  };
  svg.onmouseleave = () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); };
}


// ── Analytics ───────────────────────────────────────────────────────────
// Gleiche Daten wie das Owner-Dashboard der App (dashboard-analytics.query.ts).
// Regeln wie dort: duenne Marks, Hairline-Raster, Text nie in Datenfarbe,
// jede Karte auch als Tabelle. Farbe folgt dem Mandanten (feste Reihenfolge).
let range = 30;
const anCache = {};           // `${key}:${days}` -> Antwort
const anTables = new Set();   // Karten, die gerade als Tabelle stehen
const plots = {};             // data-plot-ID -> Zeichenfunktion(el)
const VIZ = [1, 2, 3, 4, 5].map((i) => `var(--viz-${i})`);
const ACC = 'var(--series)';
const WD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const STAGES = { registered: 'Registriert', verified: 'E-Mail bestätigt', photo: 'Profilfoto', contacted: 'Kontakt aufgenommen', conversation: 'Im Gespräch', premium: 'Premium' };
const PLANS = { monthly: 'Monatlich', yearly: 'Jährlich', lifetime: 'Lifetime' };

const nf = (v) => v >= 10000
  ? new Intl.NumberFormat('de-DE', { notation: 'compact', maximumFractionDigits: 1 }).format(v)
  : Math.round(v).toLocaleString('de-DE');
const ef = (v, compact) => new Intl.NumberFormat('de-DE', {
  style: 'currency', currency: 'EUR',
  ...(compact ? { notation: 'compact', maximumFractionDigits: 1 } : { maximumFractionDigits: v >= 1000 ? 0 : 2 }),
}).format(v);
const sum = (a) => a.reduce((s, v) => s + v, 0);

// Bucket "YYYY-MM-DDTHH:00" (Berliner Wandzeit, ohne Zone)
function bp(b) {
  const [date, time] = b.split('T');
  const [y, m, d] = date.split('-').map(Number);
  return { date, time, y, m, d, wd: (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7 };
}
function axisLabels(a) {
  const hourly = a.range.bucket === 'hour';
  const p = a.buckets.map(bp);
  return {
    hourly,
    x: p.map((b) => (hourly ? `${WD[b.wd]} ${b.time}` : `${b.d}.${b.m}.`)),
    tips: p.map((b) => `${WD[b.wd]}, ${b.d}.${b.m}.${b.y}${hourly ? ` · ${b.time}` : ''}`),
  };
}
function niceTicks(max) {
  if (max <= 0) return [0, 1];
  const raw = max / 3, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const t = [0];
  while (t.at(-1) < max) t.push(+(t.at(-1) + step).toFixed(6));
  return t;
}
function activitySeries(a, modules) {
  return [
    ...(modules.chat ? [
      { label: 'Nachrichten', color: VIZ[0], values: a.series.messages },
      { label: 'Kontaktanfragen', color: VIZ[1], values: a.series.contactRequests },
    ] : []),
    { label: 'Uploads', color: VIZ[2], values: a.series.uploads },
    ...(modules.hidden ? [{ label: 'Coin-Buchungen', color: VIZ[3], values: a.series.coins }] : []),
  ];
}

// ── Bausteine (HTML) ──
function vizCard({ id, title, sub = '', big = '', wide = false, body, table }) {
  const asTable = anTables.has(id) && table;
  return `<section class="viz${wide ? ' wide' : ''}">
    <header><div><h3>${esc(title)}</h3>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>
      ${big ? `<span class="big">${esc(big)}</span>` : '<span class="spacer"></span>'}
      ${table ? `<button class="tbl" data-table="${id}">${asTable ? 'Diagramm' : 'Tabelle'}</button>` : ''}</header>
    ${asTable ? dataTable(table) : body}
  </section>`;
}
function dataTable({ head, rows }) {
  return `<div class="tblwrap"><table class="data"><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const legend = (items) => `<ul class="legend">${items.map((i) =>
  `<li><span class="sw" style="background:${i.color}"></span>${esc(i.label)}${i.value !== undefined ? ` <b>${esc(i.value)}</b>` : ''}</li>`).join('')}</ul>`;
function plot(id, draw, height) {
  plots[id] = draw;
  return `<div class="plot" data-plot="${id}" style="height:${height}px"></div>`;
}
function kpi(label, value, cur, prev, spark) {
  const delta = prev > 0 ? (cur - prev) / prev : null;
  const d = delta === null
    ? (cur > 0 ? '<b>neu</b> vs. Vorperiode' : '&nbsp;')
    : `<span class="${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '▲' : '▼'}</span> <b>${delta >= 0 ? '+' : '−'}${Math.abs(Math.round(delta * 100))} %</b> vs. Vorperiode`;
  return `<div class="kpi"><div class="label">${esc(label)}</div>
    <div class="row2"><div class="value">${esc(value)}</div>${spark ? sparkline(spark) : ''}</div>
    <div class="delta">${d}</div></div>`;
}
function sparkline(vals) {
  const size = Math.max(1, Math.ceil(vals.length / 14));
  const v = [];
  for (let i = 0; i < vals.length; i += size) v.push(sum(vals.slice(i, i + size)));
  if (v.length < 2) return '';
  const W = 76, H = 28, P = 3, max = Math.max(...v, 1);
  const pts = v.map((y, i) => [P + (i / (v.length - 1)) * (W - 2 * P), H - P - (y / max) * (H - 2 * P)]);
  const d = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join('');
  const [lx, ly] = pts.at(-1);
  return `<svg width="${W}" height="${H}" aria-hidden="true"><path d="${d}L${lx},${H - P}L${P},${H - P}Z" fill="${ACC}" opacity=".1"/>
    <path d="${d}" fill="none" stroke="${ACC}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="3" fill="${ACC}" stroke="var(--card)" stroke-width="2"/></svg>`;
}
function funnelHtml(stages) {
  const first = Math.max(stages[0]?.count ?? 0, 1);
  return `<ol class="funnel">${stages.map((s, i) => {
    const prev = i ? stages[i - 1].count : s.count;
    const pct = i === 0 ? '100 % aller Mitglieder' : `${prev ? Math.round((s.count / prev) * 100) : 0} % der vorigen Stufe`;
    const strength = 45 + (55 * i) / Math.max(stages.length - 1, 1);
    return `<li><div class="fl"><span>${esc(STAGES[s.key])}</span><b>${nf(s.count)}</b><small>${pct}</small></div>
      <div class="track"><div style="width:${Math.max((s.count / first) * 100, s.count ? 1.5 : 0)}%;background:color-mix(in oklab, ${ACC} ${strength}%, var(--grid))"></div></div></li>`;
  }).join('')}</ol>`;
}
function barsHtml(items, fmtV) {
  const max = Math.max(...items.map((i) => i.count), 1);
  return `<ol class="bars">${items.map((i) => `<li><span>${i.color ? `<span class="sw" style="background:${i.color}"></span>` : ''}${esc(i.name)}</span>
    <div class="track"><div style="width:${(i.count / max) * 100}%;background:${i.color ?? ACC}"></div></div><b>${esc(fmtV(i.count))}</b></li>`).join('')}</ol>`;
}
function splitHtml(parts) {
  const total = sum(parts.map((p) => p.count));
  return `<div class="split" role="img" aria-label="${esc(parts.map((p) => `${p.label} ${p.count}`).join(', '))}">${parts.filter((p) => p.count)
    .map((p) => `<div style="width:${(p.count / total) * 100}%;background:${p.color}"></div>`).join('')}</div>
    ${legend(parts.map((p) => ({ label: p.label, color: p.color, value: `${nf(p.count)} · ${total ? Math.round((p.count / total) * 100) : 0} %` })))}`;
}

// ── Diagramme (SVG, Breite erst nach dem Einfuegen bekannt) ──
const M = { t: 12, r: 12, b: 24, l: 44 };
function frame(el, height) {
  const W = el.clientWidth, H = height;
  return { W, H, pw: Math.max(W - M.l - M.r, 1), ph: H - M.t - M.b };
}
function axes(W, H, ticks, y, xl, xPos, fmtV, plotW) {
  const count = Math.max(2, Math.min(xl.length, Math.floor(plotW / 80)));
  const idx = xl.length <= count ? xl.map((_, i) => i) : Array.from({ length: count }, (_, i) => Math.round((i * (xl.length - 1)) / (count - 1)));
  return ticks.map((t) => `<line x1="${M.l}" x2="${W - M.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/>
      <text x="${M.l - 6}" y="${y(t)}" dy=".32em" text-anchor="end">${esc(fmtV(t))}</text>`).join('')
    + idx.map((i, k) => `<text x="${xPos(i)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === idx.length - 1 ? 'end' : 'middle'}">${esc(xl[i])}</text>`).join('');
}
function showTip(el, x, y, title, rows) {
  let tip = el.querySelector('.tip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; el.appendChild(tip); }
  tip.replaceChildren();
  const t = document.createElement('div'); t.className = 't'; t.textContent = title; tip.appendChild(t);
  for (const r of rows) {
    const row = document.createElement('div'); row.className = 'r';
    if (r.color) { const k = document.createElement('span'); k.className = r.line ? 'ln' : 'sw'; k.style.background = r.color; row.appendChild(k); }
    const b = document.createElement('b'); b.textContent = r.value; row.appendChild(b);
    const l = document.createElement('span'); l.className = 'muted'; l.textContent = r.label; row.appendChild(l);
    tip.appendChild(row);
  }
  tip.style.display = 'block';
  tip.style.left = `${Math.min(Math.max(x + 12, 0), Math.max(el.clientWidth - tip.offsetWidth, 0))}px`;
  tip.style.top = `${Math.max(y - 12, 0)}px`;
}
const hideTip = (el) => { const t = el.querySelector('.tip'); if (t) t.style.display = 'none'; };

// Linien (eine oder mehrere Reihen, null = noch nicht gestartet); bei einer Reihe mit Flaeche
function drawLines(el, { series, x: xl, tips, fmtV, height }) {
  const { W, H, pw, ph } = frame(el, height);
  const n = xl.length;
  const ticks = niceTicks(Math.max(...series.flatMap((s) => s.values.filter((v) => v !== null)), 0));
  const top = ticks.at(-1);
  const x = (i) => M.l + (n > 1 ? (i / (n - 1)) * pw : pw / 2);
  const y = (v) => M.t + ph - (v / top) * ph;
  const paths = series.map((s) => {
    const pts = s.values.map((v, i) => (v === null ? null : [x(i), y(v)])).filter(Boolean);
    if (!pts.length) return '';
    const d = pts.map(([px, py], i) => `${i ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`).join('');
    const area = series.length === 1 ? `<path d="${d}L${pts.at(-1)[0]},${y(0)}L${pts[0][0]},${y(0)}Z" fill="${s.color}" opacity=".1"/>` : '';
    const [ex, ey] = pts.at(-1);
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${ex}" cy="${ey}" r="4.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`;
  }).join('');
  const last = series.length === 1 ? `<text class="strong" x="${x(n - 1) - 8}" y="${y(series[0].values.at(-1)) - 10}" text-anchor="end">${esc(fmtV(series[0].values.at(-1)))}</text>` : '';
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(series.map((s) => s.label).join(', '))}">
    ${axes(W, H, ticks, y, xl, x, fmtV, pw)}${paths}${last}
    <line class="cross" y1="${M.t}" y2="${M.t + ph}" stroke="var(--muted)" opacity=".5" visibility="hidden"/>
    <rect x="${M.l}" y="${M.t}" width="${pw}" height="${ph}" fill="transparent"/></svg>`;
  const svg = el.querySelector('svg'), cross = svg.querySelector('.cross');
  svg.querySelector('rect').onpointermove = (e) => {
    const i = Math.min(Math.max(Math.round(((e.clientX - svg.getBoundingClientRect().left - M.l) / pw) * (n - 1)), 0), n - 1);
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    const rows = series.filter((s) => s.values[i] !== null).map((s) => ({ label: s.label, value: fmtV(s.values[i]), color: s.color, line: true }));
    showTip(el, x(i), M.t, tips[i], rows);
  };
  svg.querySelector('rect').onpointerleave = () => { cross.setAttribute('visibility', 'hidden'); hideTip(el); };
}

// Saeulen, gestapelt bei mehreren Reihen: oben 4px rund, 2px Abstand zwischen Segmenten
function drawColumns(el, { series, x: xl, tips, fmtV, height }) {
  const { W, H, pw, ph } = frame(el, height);
  const n = xl.length;
  const totals = xl.map((_, i) => sum(series.map((s) => s.values[i])));
  const ticks = niceTicks(Math.max(...totals, 0));
  const top = ticks.at(-1);
  const slot = pw / Math.max(n, 1), bw = Math.max(Math.min(slot - 2, 24), 1), gap = bw >= 6 ? 2 : 0;
  const x = (i) => M.l + slot * i + slot / 2;
  const y = (v) => M.t + ph - (v / top) * ph;
  const cols = xl.map((_, i) => {
    let base = 0;
    const vis = series.filter((s) => s.values[i] > 0);
    return `<g data-i="${i}">${vis.map((s, k) => {
      const v = s.values[i], y0 = y(base) - (k ? gap : 0), h = Math.max(y(base) - y(base + v) - (k ? gap : 0), 0.5);
      base += v;
      const r = k === vis.length - 1 ? Math.min(4, bw / 2, h) : 0, bx = x(i) - bw / 2, by = y0 - h;
      return `<path d="M${bx},${by + h}V${by + r}Q${bx},${by} ${bx + r},${by}H${bx + bw - r}Q${bx + bw},${by} ${bx + bw},${by + r}V${by + h}Z" fill="${s.color}"/>`;
    }).join('')}</g>`;
  }).join('');
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(series.map((s) => s.label).join(', '))}">
    ${axes(W, H, ticks, y, xl, x, fmtV, pw)}${cols}
    ${xl.map((_, i) => `<rect data-i="${i}" x="${M.l + slot * i}" y="${M.t}" width="${slot}" height="${ph}" fill="transparent"/>`).join('')}</svg>`;
  const svg = el.querySelector('svg');
  svg.onpointerover = (e) => {
    const i = e.target.dataset?.i;
    if (i === undefined || e.target.tagName !== 'rect') return;
    svg.querySelectorAll('g[data-i]').forEach((g) => g.setAttribute('opacity', g.dataset.i === i ? 1 : 0.55));
    const rows = series.map((s) => ({ label: s.label, value: fmtV(s.values[i]), color: s.color }));
    if (series.length > 1) rows.push({ label: 'Gesamt', value: fmtV(totals[i]) });
    showTip(el, x(+i), y(totals[i]), tips[i], rows);
  };
  svg.onpointerleave = () => { svg.querySelectorAll('g[data-i]').forEach((g) => g.removeAttribute('opacity')); hideTip(el); };
}

// Wochentag × Stunde, Skala bis zum 95. Perzentil (ein Ausreisser faerbt sonst alles blass)
function heatShade(min, max) {
  return (v) => v === 0 ? 'var(--grid)'
    : `color-mix(in oklab, ${ACC} ${Math.round(12 + 88 * (max > min ? Math.min((v - min) / (max - min), 1) : 1))}%, var(--grid))`;
}
function heatRange(grid) {
  const nz = grid.flat().filter((v) => v > 0).sort((a, b) => a - b);
  const max = Math.max(nz[Math.floor((nz.length - 1) * 0.95)] ?? 1, 1);
  return [Math.min(nz[0] ?? max, max), max];
}
function drawHeat(el, { grid }) {
  const W = el.clientWidth, LW = 26, cell = Math.max(Math.min((W - LW) / 24, 24), 6), H = cell * 7 + 18;
  const [min, max] = heatRange(grid), shade = heatShade(min, max);
  el.style.height = `${H}px`;
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Aktivität nach Wochentag und Uhrzeit">
    ${grid.map((row, d) => `<text x="0" y="${d * cell + cell / 2}" dy=".32em">${WD[d]}</text>${row.map((v, h) =>
      `<rect data-d="${d}" data-h="${h}" x="${LW + h * cell + 1}" y="${d * cell + 1}" width="${cell - 2}" height="${cell - 2}" rx="${Math.min(3, cell / 4)}" fill="${shade(v)}"/>`).join('')}`).join('')}
    ${[0, 6, 12, 18, 23].map((h) => `<text x="${LW + h * cell + cell / 2}" y="${7 * cell + 13}" text-anchor="middle">${String(h).padStart(2, '0')}</text>`).join('')}</svg>`;
  const svg = el.querySelector('svg');
  svg.onpointerover = (e) => {
    const { d, h } = e.target.dataset ?? {};
    if (d === undefined) return;
    const hh = (k) => String(k).padStart(2, '0');
    showTip(el, LW + h * cell, d * cell, `${WD[d]}, ${hh(+h)}:00–${hh(+h + 1)}:00`, [{ label: 'Aktivitäten', value: nf(grid[d][h]) }]);
  };
  svg.onpointerleave = () => hideTip(el);
}
function heatLegend(grid) {
  const [min, max] = heatRange(grid), shade = heatShade(min, max);
  return `<div class="heatlegend" aria-hidden="true">wenig ${[0, .25, .5, .75, 1].map((f) => `<span class="c" style="background:${shade(min + f * (max - min))}"></span>`).join('')} viel</div>`;
}

// ── Ansichten ──
function rangeBar(title, extra = '') {
  return `<div class="an-bar"><h2>${esc(title)}</h2>
    <div class="seg" role="radiogroup" aria-label="Zeitraum">${[7, 30, 90].map((d) =>
      `<button role="radio" data-days="${d}" aria-checked="${d === range}">${d} Tage</button>`).join('')}</div>
    <span class="spacer"></span>${extra}</div>`;
}

function detailAnalytics(r) {
  if (!r.analytics) return `${rangeBar('Analytics')}<div class="error">Analytics nicht abrufbar: ${esc(r.error ?? '')}</div>`;
  const a = r.analytics, m = r.modules, L = axisLabels(a);
  const per = L.hourly ? 'pro Stunde' : 'pro Tag';
  let run = a.usersBefore;
  const cum = a.series.signups.map((v) => (run += v));
  const act = activitySeries(a, m);
  const actTotal = a.buckets.map((_, i) => sum(act.map((s) => s.values[i])));
  const funnel = a.funnel.filter((s) => m.payments || s.key !== 'premium');
  const since = a.range.launchedAt ? `<span class="muted">● live seit ${new Date(a.range.launchedAt).toLocaleDateString('de-DE')}</span>` : '';
  const k = a.kpis;
  return `${rangeBar('Analytics', since)}
    <div class="an-kpis">
      ${kpi('Neue Mitglieder', nf(k.signups.current), k.signups.current, k.signups.previous, a.series.signups)}
      ${kpi('Aktivitäten', nf(k.activity.current), k.activity.current, k.activity.previous, actTotal)}
      ${m.payments ? kpi('Umsatz', ef(k.revenue.current), k.revenue.current, k.revenue.previous, a.series.revenue) : ''}
      ${m.payments ? kpi('Aktive Abos', nf(k.activeSubscriptions.current), k.activeSubscriptions.current, k.activeSubscriptions.previous) : ''}
    </div>
    <div class="an-grid">
      ${vizCard({ id: 'growth', wide: true, title: 'Mitgliederwachstum', sub: 'Mitglieder gesamt', big: nf(cum.at(-1) ?? 0),
        body: plot('growth', (el) => drawLines(el, { series: [{ label: 'Mitglieder', color: ACC, values: cum }], x: L.x, tips: L.tips, fmtV: nf, height: 240 }), 240),
        table: { head: ['Zeit', 'Mitglieder', 'Neu'], rows: L.tips.map((t, i) => [t, nf(cum[i]), nf(a.series.signups[i])]) } })}
      ${vizCard({ id: 'activity', wide: true, title: 'Aktivität', sub: `Ereignisse nach Art · ${per}`,
        body: legend(act.map((s) => ({ label: s.label, color: s.color, value: nf(sum(s.values)) })))
          + plot('activity', (el) => drawColumns(el, { series: act, x: L.x, tips: L.tips, fmtV: nf, height: 240 }), 240),
        table: { head: ['Zeit', ...act.map((s) => s.label), 'Gesamt'], rows: L.tips.map((t, i) => [t, ...act.map((s) => nf(s.values[i])), nf(actTotal[i])]) } })}
      ${vizCard({ id: 'signups', title: 'Neuanmeldungen', sub: per,
        body: plot('signups', (el) => drawColumns(el, { series: [{ label: 'Neuanmeldungen', color: ACC, values: a.series.signups }], x: L.x, tips: L.tips, fmtV: nf, height: 200 }), 200),
        table: { head: ['Zeit', 'Anzahl'], rows: L.tips.map((t, i) => [t, nf(a.series.signups[i])]) } })}
      ${m.payments ? vizCard({ id: 'revenue', title: 'Umsatz', sub: `Erfolgreiche Zahlungen · ${per}`, big: ef(k.revenue.current),
        body: plot('revenue', (el) => drawColumns(el, { series: [{ label: 'Umsatz', color: ACC, values: a.series.revenue }], x: L.x, tips: L.tips, fmtV: (v) => ef(v, true), height: 200 }), 200),
        table: { head: ['Zeit', 'Umsatz'], rows: L.tips.map((t, i) => [t, ef(a.series.revenue[i])]) } }) : ''}
      ${vizCard({ id: 'funnel', title: 'Conversion-Funnel', sub: 'Vom Konto zum Premium-Mitglied', body: funnelHtml(funnel),
        table: { head: ['Stufe', 'Anzahl', 'Anteil'], rows: funnel.map((s) => [STAGES[s.key], nf(s.count), `${Math.round((s.count / Math.max(funnel[0].count, 1)) * 100)} %`]) } })}
      ${vizCard({ id: 'heat', title: 'Wann ist was los?', sub: 'Aktivitäten nach Wochentag und Uhrzeit',
        body: plot('heat', (el) => drawHeat(el, { grid: a.heatmap }), 180) + heatLegend(a.heatmap),

      ${m.payments ? vizCard({ id: 'plans', title: 'Abo-Mix', sub: 'Aktive Abos nach Laufzeit', big: nf(sum(a.plans.map((p) => p.count))),
        body: splitHtml(a.plans.map((p, i) => ({ label: PLANS[p.plan], count: p.count, color: VIZ[i] }))),

      ${vizCard({ id: 'interests', title: 'Top-Interessen', body: barsHtml(a.topInterests, nf),

}

// Alle Mandanten: Farbe pro Mandant fest nach Reihenfolge in tenants/
function compareAnalytics(list) {
  const ok = list.filter((r) => r.analytics);
  if (!ok.length) return `${rangeBar('Vergleich')}<p class="muted">Keine Mandanten-DB erreichbar.</p>`;
  const color = Object.fromEntries(list.map((r, i) => [r.slug, VIZ[i % VIZ.length]]));
  // Gemeinsame Tagesachse; ein Mandant beginnt erst an seinem ersten Tag
  const today = new Date();
  const days = Array.from({ length: range + 1 }, (_, i) => {
    const d = new Date(today); d.setDate(d.getDate() - range + i);
    return d.toLocaleDateString('sv-SE');
  });
  const cumBy = ok.map((r) => {
    const a = r.analytics, byDate = {};
    let run = a.usersBefore;
    a.buckets.forEach((b, i) => { run += a.series.signups[i]; byDate[b.slice(0, 10)] = run; });
    let last = null;
    return { label: r.name, color: color[r.slug], values: days.map((d) => (d in byDate ? (last = byDate[d]) : last)) };
  });
  const x = days.map((d) => { const [, m, dd] = d.split('-').map(Number); return `${dd}.${m}.`; });
  const tips = days.map((d) => { const p = bp(`${d}T00:00`); return `${WD[p.wd]}, ${p.d}.${p.m}.${p.y}`; });
  const members = ok.map((r) => ({ name: r.name, color: color[r.slug], count: r.analytics.usersBefore + sum(r.analytics.series.signups) }));
  const activity = ok.map((r) => ({ name: r.name, color: color[r.slug], count: r.analytics.kpis.activity.current }));
  const revenue = ok.filter((r) => r.modules.payments).map((r) => ({ name: r.name, color: color[r.slug], count: r.analytics.kpis.revenue.current }));
  const byCount = (a, b) => b.count - a.count;
  const K = (key) => ({ cur: sum(ok.map((r) => r.analytics.kpis[key].current)), prev: sum(ok.map((r) => r.analytics.kpis[key].previous)) });
  const s = K('signups'), act = K('activity'), rev = K('revenue');
  const allSignups = days.map((d) => sum(ok.map((r) => sum(r.analytics.buckets.map((b, i) => (b.startsWith(d) ? r.analytics.series.signups[i] : 0))))));
  return `${rangeBar('Vergleich aller Mandanten')}
    <div class="an-kpis">
      ${kpi('Mitglieder gesamt', nf(sum(members.map((m) => m.count))), 0, 0)}
      ${kpi('Neue Mitglieder', nf(s.cur), s.cur, s.prev, allSignups)}
      ${kpi('Aktivitäten', nf(act.cur), act.cur, act.prev)}
      ${kpi('Umsatz', ef(rev.cur), rev.cur, rev.prev)}
    </div>
    <div class="an-grid">
      ${vizCard({ id: 'cmp-growth', wide: true, title: 'Mitgliederwachstum je Mandant', sub: 'Mitglieder gesamt, ab Start des Mandanten',
        body: legend(cumBy.map((c) => ({ label: c.label, color: c.color, value: nf(c.values.at(-1) ?? 0) })))
          + plot('cmp-growth', (el) => drawLines(el, { series: cumBy, x, tips, fmtV: nf, height: 260 }), 260),
        table: { head: ['Tag', ...cumBy.map((c) => c.label)], rows: tips.map((t, i) => [t, ...cumBy.map((c) => (c.values[i] === null ? '–' : nf(c.values[i])))]) } })}
      ${vizCard({ id: 'cmp-members', title: 'Mitglieder', sub: 'gesamt', body: barsHtml([...members].sort(byCount), nf),
        table: { head: ['Mandant', 'Mitglieder'], rows: members.map((m) => [m.name, nf(m.count)]) } })}
      ${vizCard({ id: 'cmp-activity', title: 'Aktivitäten', sub: `letzte ${range} Tage`, body: barsHtml([...activity].sort(byCount), nf),
        table: { head: ['Mandant', 'Aktivitäten'], rows: activity.map((m) => [m.name, nf(m.count)]) } })}
      ${revenue.length ? vizCard({ id: 'cmp-revenue', title: 'Umsatz', sub: `letzte ${range} Tage`, body: barsHtml([...revenue].sort(byCount), (v) => ef(v)),
        table: { head: ['Mandant', 'Umsatz'], rows: revenue.map((m) => [m.name, ef(m.count)]) } }) : ''}
    </div>`;
}

// Fuellt #an-root (Uebersicht: alle, Detail: ein Mandant). Beim Nachladen
// bleibt der alte Stand blass stehen statt zu springen.
async function mountAnalytics(fetchFresh = false) {
  const root = document.getElementById('an-root');
  if (!root) return;
  const key = root.dataset.key, cacheKey = `${key}:${range}`;
  if (!anCache[cacheKey] || fetchFresh) {
    root.classList.add('loading');
    const url = key === '*' ? `/api/analytics?days=${range}` : `/api/tenants/${encodeURIComponent(key)}/analytics?days=${range}`;
    try {
      anCache[cacheKey] = await fetch(url).then((r) => r.json());
    } catch (err) {
      root.classList.remove('loading');
      root.innerHTML = `<div class="error">Analytics nicht abrufbar: ${esc(err.message)}</div>`;
      return;
    }
    if (document.getElementById('an-root') !== root || `${root.dataset.key}:${range}` !== cacheKey) return;
  }
  for (const id of Object.keys(plots)) delete plots[id];
  root.innerHTML = key === '*' ? compareAnalytics(anCache[cacheKey]) : detailAnalytics(anCache[cacheKey]);
  root.classList.remove('loading');
  drawPlots();
}
function drawPlots() {
  document.querySelectorAll('[data-plot]').forEach((el) => plots[el.dataset.plot]?.(el));
}
document.getElementById('view').addEventListener('click', (e) => {
  const d = e.target.closest('.seg button[data-days]');
  if (d) { range = +d.dataset.days; mountAnalytics(); return; }
  const t = e.target.closest('button[data-table]');
  if (t) {
    const id = t.dataset.table;
    anTables.has(id) ? anTables.delete(id) : anTables.add(id);
    mountAnalytics();
  }
});


// ── Editor ──────────────────────────────────────────────────────────────
let meta = null;
// Cache-Buster fuer Logo-Bilder, neu bei jedem load()
let assetVersion = Date.now();
const assetUrl = (slug, name) => `/api/tenants/${encodeURIComponent(slug)}/asset/${encodeURIComponent(name)}?v=${assetVersion}`;
let draft = null;      // Arbeitskopie der rohen tenant.json
let draftSlug = null;
let colorScope = null; // 'tokens' (beide Modi) | 'dark' | 'light' — welcher Satz im Farb-Editor bearbeitet wird
let checked = null;    // Ergebnis von /preview fuer genau diesen Draft

function getPath(obj, p) { return p.split('.').reduce((o, k) => o?.[k], obj); }
function setPath(obj, p, v) {
  const keys = p.split('.');
  const last = keys.pop();
  const target = keys.reduce((o, k) => (o[k] ??= {}), obj);
  if (v === undefined || v === '') delete target[last]; else target[last] = v;
}

function text(label, p, optional) {
  return `<label>${label}${optional ? ' (optional)' : ''}<input type="text" data-path="${p}" value="${esc(getPath(draft, p) ?? '')}"></label>`;
}

// ── Farben ──────────────────────────────────────────────────────────────
// Paare, die im Frontend wirklich zusammen vorkommen (bg-primary-fixed-dim +
// text-on-primary-container ist die haeufigste Kombination, Chat-Bubbles siehe
// frontend/app/(app)/chat/[id]/page.tsx)
const CONTRAST_PAIRS = [
  ['--color-on-primary-container', '--color-primary-fixed-dim', 'Button-Text auf Primär'],
  ['--color-primary-fixed-dim', '--color-background', 'Primär als Text auf Hintergrund'],
  ['--color-background', '--color-primary-fixed-dim', 'empfangene Chat-Bubble'],
];

function hexToRgb(hex) {
  let h = hex.slice(1);
  if (h.length <= 4) h = [...h].map((c) => c + c).join('');
  return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
}
// WCAG 2.x relative Luminanz / Kontrastverhaeltnis
function luminance(hex) {
  const [r, g, b] = hexToRgb(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
function contrast(a, b) {
  const [hi, lo] = [luminance(a), luminance(b)].sort((x, y) => y - x);
  return (hi + 0.05) / (lo + 0.05);
}
const isHex = (v) => /^#([0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v ?? '');
const toColorInput = (v) => {
  if (!isHex(v)) return '#000000';
  const [r, g, b] = hexToRgb(v);
  return '#' + [r, g, b].map((x) => x.toString(16).padStart(2, '0')).join('');
};

// Wie im Frontend: Basis, dann theme.tokens (beide Modi), dann theme.dark/light
function effectiveTokens(mode) {
  const hex = (o) => Object.fromEntries(Object.entries(o ?? {}).filter(([, v]) => isHex(v)));
  return { ...meta.baseTokens[mode], ...hex(draft.theme?.tokens), ...hex(draft.theme?.[mode]) };
}

function scope() {
  if (!colorScope) {
    const mode = draft.theme?.default === 'light' ? 'light' : 'dark';
    colorScope = Object.keys(draft.theme?.[mode] ?? {}).length ? mode : 'tokens';
  }
  return colorScope;
}

function previewPane(mode) {
  const tk = effectiveTokens(mode);
  const vars = Object.entries(tk).map(([k, v]) => `${k}:${v}`).join(';');
  const rows = CONTRAST_PAIRS.map(([fg, bg, label]) => {
    const r = contrast(tk[fg], tk[bg]);
    const ok = r >= 4.5;
    return `<div class="${ok ? '' : 'warn'}">${ok ? '✓' : '⚠'} ${label}: ${r.toFixed(1)}:1 ${ok ? '(AA)' : r >= 3 ? '(nur große Schrift)' : '(zu wenig)'}</div>`;
  }).join('');
  return `<div class="pv" style="${vars}">
      <div class="pv-nav"><b>${esc(draft.brand?.name ?? '')}</b><span class="active">Chats</span><span class="muted2">Profil</span><span class="pv-badge">3</span></div>
      <div class="pv-body">
        <div class="pv-card"><strong>Neue Kontaktanfrage</strong><small>vor 5 Minuten · <span class="pv-tert">Premium</span></small>
          <div class="pv-btns"><span class="pv-btn">Annehmen</span><span class="pv-btn2">Später</span></div></div>
        <div class="pv-bubbles"><span class="pv-in">Hey, wie geht's?</span><span class="pv-out">Gut, und dir?</span></div>
      </div>
      <div class="contrast"><strong>${mode}</strong>${rows}</div>
    </div>`;
}

function renderPreviews() {
  return previewPane(draft.theme?.default === 'light' ? 'light' : 'dark') + previewPane(draft.theme?.default === 'light' ? 'dark' : 'light');
}

function colorFieldset() {
  const own = draft.theme?.[scope()] ?? {};
  const rows = Object.keys(meta.baseTokens.dark).map((k) => {
    const set = k in own;
    const v = set ? own[k] : '';
    return `<div class="token${set ? ' set' : ''}" title="${k}">
        <input type="color" data-token-color="${k}" value="${toColorInput(set ? v : meta.baseTokens[draft.theme?.default === 'light' ? 'light' : 'dark'][k])}">
        <input type="text" data-token="${k}" value="${esc(v)}" placeholder="Standard">
        <code>${k.replace('--color-', '')}</code>
        ${set ? `<button type="button" data-token-reset="${k}">↺</button>` : ''}
      </div>`;
  }).join('');
  const scopes = [['tokens', 'beide Modi'], ['dark', 'nur dark'], ['light', 'nur light']]
    .map(([v, l]) => `<button type="button" data-color-scope="${v}"${scope() === v ? ' class="active" aria-pressed="true"' : ' aria-pressed="false"'}>${l}</button>`).join('');
  return `<fieldset><legend>Farben — leer = Standard. „nur dark/light“ schlägt „beide Modi“</legend>
      <div class="seg">${scopes}</div>
      <div class="tokens">${rows}</div>
      <div class="previews" id="previews">${renderPreviews()}</div>
    </fieldset>`;
}

function setToken(key, value) {
  const field = scope();
  draft.theme[field] ??= {};
  if (value) draft.theme[field][key] = value; else delete draft.theme[field][key];
}

function renderEditor(slug) {
  const t = tenants.find((x) => x.slug === slug);
  if (!t) return `<p>Mandant „${esc(slug)}“ nicht gefunden. <a href="#/">Zurück</a></p>`;
  if (draftSlug !== slug) { draft = structuredClone(t.config); draftSlug = slug; checked = null; colorScope = null; }
  const tierDefaults = meta.tierModules[draft.tier] ?? {};
  const modules = meta.modules.map((m) => {
    const v = draft.modules?.[m];
    const opt = (val, label) => `<option value="${val}"${String(v) === val ? ' selected' : ''}>${label}</option>`;
    return `<label>${m}<select data-module="${m}">
      ${opt('undefined', `Tier-Standard (${tierDefaults[m] ? 'an' : 'aus'})`)}${opt('true', 'an')}${opt('false', 'aus')}
    </select></label>`;
  }).join('');
  const avail = draft.locale?.available ?? [];
  const locales = meta.locales.map((l) => `<label><input type="checkbox" data-locale="${l}"${avail.includes(l) ? ' checked' : ''}>${l}</label>`).join('');
  const defaults = avail.map((l) => `<option${draft.locale.default === l ? ' selected' : ''}>${l}</option>`).join('');
  const result = !checked ? ''
    : checked.error ? `<div class="error">${esc(checked.error)}</div>`
    : !checked.diff ? '<p class="note muted">Keine Änderung.</p>'
    : `<pre class="diff">${checked.diff.split('\n').filter((l) => !/^(diff|index|---|\+\+\+)/.test(l)).map((l) =>
        `<span class="${l[0] === '+' ? 'add' : l[0] === '-' ? 'del' : ''}">${esc(l)}</span>`).join('\n')}</pre>`;
  const canSave = checked && !checked.error && checked.diff;
  return `<p class="actions"><a href="#/t/${encodeURIComponent(slug)}">← ${esc(t.config.brand?.name ?? slug)}</a></p>
    <h2>${esc(slug)}/tenant.json bearbeiten</h2>
    <form class="form" id="editor" onsubmit="return false">
      <fieldset><legend>Marke</legend>${text('Name', 'brand.name')}
        <div class="logo-row">
          ${draft.brand?.logo ? ['#ffffff', '#0b1326'].map((bg) => `<div class="logo-bg" style="background:${bg}"><img src="${assetUrl(slug, draft.brand.logo)}" alt="Logo"></div>`).join('') : '<span class="muted">kein Logo</span>'}
          <label class="drop" id="drop">Logo hierher ziehen oder klicken<br><small>PNG, JPG, WebP oder SVG · max. 2 MB · Favicon wird erzeugt · speichert + committet sofort</small>
            <input type="file" id="logo-file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden></label>
        </div>
        <span class="note" id="logo-msg"></span>
      </fieldset>
      <fieldset><legend>Theme & Tier</legend><div class="row">
        <label><input type="radio" name="theme" data-path="theme.default" value="dark"${draft.theme?.default === 'dark' ? ' checked' : ''}>dark</label>
        <label><input type="radio" name="theme" data-path="theme.default" value="light"${draft.theme?.default === 'light' ? ' checked' : ''}>light</label>
        <label style="display:grid;color:var(--muted);font-size:12px">Tier<select data-path="tier">${meta.tiers.map((x) => `<option${draft.tier === x ? ' selected' : ''}>${x}</option>`).join('')}</select></label>
      </div></fieldset>
      ${colorFieldset()}
      <fieldset><legend>Module</legend><div class="row">${modules}</div></fieldset>
      <fieldset><legend>Sprachen</legend><div class="row">${locales}</div>
        <label>Standardsprache<select data-path="locale.default">${defaults}</select></label></fieldset>
      <fieldset><legend>Impressum</legend>${text('Name', 'legal.name')}${text('Anschrift', 'legal.address')}${text('E-Mail', 'legal.email')}</fieldset>
      <fieldset><legend>Demo-Daten</legend>${text('Seed (Ordner unter tenants/)', 'seed', true)}</fieldset>
      <div class="actions">
        <button type="button" id="check">Prüfen</button>
        <button type="button" class="primary" id="save"${canSave ? '' : ' disabled'}>Speichern & committen</button>
        <button type="button" id="reset">Verwerfen</button>
        <span class="note muted" id="saved"></span>
      </div>
      ${result}
    </form>`;
}

async function uploadLogo(file) {
  const msg = document.getElementById('logo-msg');
  msg.textContent = 'lädt hoch …';
  const res = await fetch(`/api/tenants/${draftSlug}/logo`, { method: 'POST', headers: { 'Content-Type': file.type }, body: file }).then((r) => r.json());
  if (res.error) { msg.innerHTML = `<span class="error">${esc(res.error)}</span>`; return; }
  // Nur Logo/Favicon in den Draft uebernehmen — andere ungespeicherte Eingaben bleiben
  draft.brand.logo = res.logo;
  draft.brand.favicon = res.favicon;
  checked = null;
  await load();
  const running = tenants.find((x) => x.slug === draftSlug)?.running;
  document.getElementById('logo-msg').innerHTML = `Gespeichert: <code>${esc(res.commit)}</code>`
    + (running ? ' <button type="button" id="restart">Mandant neu starten</button>' : ' — Mandant läuft nicht, wirkt beim nächsten Start.');
}

function onEditorInput(e) {
  const el = e.target;
  if (el.id === 'logo-file') { if (el.files[0]) uploadLogo(el.files[0]); return; }
  if (el.dataset.path) setPath(draft, el.dataset.path, el.value);
  if (el.dataset.module) {
    draft.modules ??= {};
    setPath(draft, `modules.${el.dataset.module}`, el.value === 'undefined' ? undefined : el.value === 'true');
    if (!Object.keys(draft.modules).length) delete draft.modules;
  }
  if (el.dataset.tokenColor) {
    setToken(el.dataset.tokenColor, el.value);
    const textField = document.querySelector(`input[data-token="${el.dataset.tokenColor}"]`);
    textField.value = el.value;
    textField.closest('.token').classList.add('set');
  }
  if (el.dataset.token) {
    setToken(el.dataset.token, el.value.trim());
    if (isHex(el.value.trim())) document.querySelector(`input[data-token-color="${el.dataset.token}"]`).value = toColorInput(el.value.trim());
    el.closest('.token').classList.toggle('set', !!el.value.trim());
  }
  if (el.dataset.tokenColor || el.dataset.token) {
    // Nur die Preview neu zeichnen — ein volles render() wuerde den Picker schliessen
    document.getElementById('previews').innerHTML = renderPreviews();
    checked = null;
    document.getElementById('save').disabled = true;
    document.querySelectorAll('#editor .diff, #editor .error').forEach((n) => n.remove());
    return;
  }
  if (el.dataset.locale) {
    const set = new Set(draft.locale.available);
    el.checked ? set.add(el.dataset.locale) : set.delete(el.dataset.locale);
    draft.locale.available = meta.locales.filter((l) => set.has(l));
  }
  checked = null;
  // Sprachliste/Tier-Standard haengen vom Draft ab — neu zeichnen, Fokus bei Textfeldern behalten
  if (el.type !== 'text') render();
  else { document.getElementById('save').disabled = true; document.querySelectorAll('#editor .diff, #editor .error').forEach((n) => n.remove()); }
}

async function post(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return res.json();
}

async function onEditorClick(e) {
  const id = e.target.id;
  if (id === 'check') {
    checked = await post(`/api/tenants/${draftSlug}/preview`, draft);
    render();
  }
  if (id === 'reset') { draftSlug = null; render(); }
  if (e.target.dataset.tokenReset) { setToken(e.target.dataset.tokenReset, ''); checked = null; render(); }
  if (e.target.dataset.colorScope) { colorScope = e.target.dataset.colorScope; render(); }
  if (id === 'save') {
    const slug = draftSlug;
    const res = await post(`/api/tenants/${slug}/save`, draft);
    if (res.error) { checked = res; render(); return; }
    await load();
    draftSlug = null;
    render();
    const t = tenants.find((x) => x.slug === slug);
    document.getElementById('saved').innerHTML = `Gespeichert: <code>${esc(res.commit ?? 'keine Änderung')}</code>`
      + (t.running ? ' <button type="button" id="restart">Mandant neu starten</button>' : ' — Mandant läuft nicht, wirkt beim nächsten Start.');
  }
  if (id === 'restart') {
    e.target.disabled = true;
    e.target.textContent = 'startet neu …';
    await post(`/api/tenants/${draftSlug}/restart`, {});
    e.target.textContent = 'neu gestartet';
  }
}

function render() {
  const edit = location.hash.match(/^#\/t\/([^/]+)\/edit$/);
  const m = location.hash.match(/^#\/t\/([^/]+)$/);
  const view = document.getElementById('view');
  view.innerHTML = edit ? renderEditor(decodeURIComponent(edit[1]))
    : m ? renderDetail(decodeURIComponent(m[1])) : renderOverview();
  if (m) drawChart(decodeURIComponent(m[1]));
  mountAnalytics();
  const up = tenants.filter((t) => t.running).length;
  document.getElementById('summary').textContent = `${tenants.length} Mandanten · ${up} laufen`;
  const lastAt = snapshots.at(-1)?.at;
  document.getElementById('stamp').textContent = lastAt ? `Stand ${fmtTime(lastAt)}` : 'noch kein Stand';
}

document.getElementById('view').addEventListener('input', (e) => { if (e.target.closest('#editor')) onEditorInput(e); });
document.getElementById('view').addEventListener('click', (e) => { if (e.target.closest('#editor')) onEditorClick(e); });
document.getElementById('view').addEventListener('click', (e) => {
  const btn = e.target.closest('button.tile');
  if (!btn) return;
  selected = btn.dataset.key;
  render();
});

document.getElementById('refresh').addEventListener('click', async (e) => {
  e.target.disabled = true;
  try {
    await fetch('/api/snapshots', { method: 'POST' });
    for (const k of Object.keys(anCache)) delete anCache[k];
    await load();
  } finally {
    e.target.disabled = false;
  }
});

async function load() {
  assetVersion = Date.now();
  [tenants, snapshots, meta] = await Promise.all([
    fetch('/api/tenants').then((r) => r.json()),
    fetch('/api/snapshots').then((r) => r.json()),
    fetch('/api/meta').then((r) => r.json()),
  ]);
  render();
}

const view = document.getElementById('view');
view.addEventListener('dragover', (e) => { const d = e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
view.addEventListener('dragleave', (e) => e.target.closest('#drop')?.classList.remove('over'));
view.addEventListener('drop', (e) => {
  const d = e.target.closest('#drop');
  if (!d) return;
  e.preventDefault();
  d.classList.remove('over');
  if (e.dataTransfer.files[0]) uploadLogo(e.dataTransfer.files[0]);
});

window.addEventListener('hashchange', render);
window.addEventListener('resize', () => { const m = location.hash.match(/^#\/t\/([^/]+)$/); if (m) drawChart(decodeURIComponent(m[1])); drawPlots(); });
load();
</script>
</body>
</html>
