# Load Balancer fuer den Loadtest-Stack (XXX_lb_load, siehe
# docker-compose.loadtest.yml). XXX_backend_load_replica loest auf alle
# Replika-IPs auf — nginx macht daraus je einen Upstream-Server.
upstream backend_load {
    least_conn;
    server XXX_backend_load:3000;
    server XXX_backend_load_replica:3000;
    keepalive 128;
    # Kuerzer als Nodes keepAliveTimeout (5s) — sonst nimmt nginx gelegentlich
    # eine Verbindung, die Node gerade schliesst -> "Connection reset by
    # peer" -> 502.
    keepalive_timeout 4s;
}

server {
    listen 80;

    # media_upload im Loadtest
    client_max_body_size 50m;

    location / {
        proxy_pass http://backend_load;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Upstream $upstream_addr always;
    }
}
