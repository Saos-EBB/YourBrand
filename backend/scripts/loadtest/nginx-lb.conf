# Load Balancer fuer den Loadtest-Stack (XXX_lb_load, siehe docker-compose.loadtest.yml).
#
# Schotten (Loadtest-Audit, Phase 1): schwere Routen laufen auf eigenen Instanzen (XXX_backend_load_heavy), damit
# eine teure Suche oder Liste den Event-Loop der schnellen Routen nicht blockiert. Die Routenliste unten muss zu den
# @RouteClass('heavy')-Decorators im Backend passen.
#
# resolve + resolver: nginx loest die Servicenamen alle 10 s neu auf. Vorher nur beim Start, nach einem
# Replika-Neustart mit neuer IP schickte nginx an die alte Adresse, bis der Client aufgab.
resolver 127.0.0.11 valid=10s ipv6=off;

# max_fails=0: nginx wirft keine Instanz wegen Fehlern aus dem Pool. Unter Ueberlast liefen Verbindungsaufbau und
# Antwort in Timeouts, das warf eine Instanz nach der anderen hinaus und machte aus Ueberlast einen Totalausfall
# (502 "no live upstreams"). Eine wirklich tote Instanz lehnt Verbindungen sofort ab (naechste wird versucht) und
# verschwindet nach spaetestens 10 s ueber den Resolver aus dem Pool.
upstream backend_fast {
    zone backend_fast 64k;
    least_conn;
    server XXX_backend_load:3000 resolve max_fails=0;
    server XXX_backend_load_replica:3000 resolve max_fails=0;
    keepalive 128;
    # Kuerzer als Nodes keepAliveTimeout (65 s, main.ts), damit nginx nie eine Verbindung nimmt, die Node gerade schliesst.
    keepalive_timeout 4s;
}

upstream backend_heavy {
    zone backend_heavy 64k;
    least_conn;
    server XXX_backend_load_heavy:3000 resolve max_fails=0;
    keepalive 32;
    keepalive_timeout 4s;
}

# Dedizierter Pool fuer Auth-Routen (Login/Register/Passwort). bcrypt ist CPU-bound und wuerde den
# libuv-Thread-Pool der Fast-Instanzen saettigen. Eigene Instanzen isolieren diesen Druck.
upstream backend_auth {
    zone backend_auth 64k;
    least_conn;
    server XXX_backend_load_auth:3000 resolve max_fails=0;
    keepalive 16;
    keepalive_timeout 4s;
}

# Socket.IO: dieselben Instanzen wie fast, aber sticky (gleiche Client-IP → gleiche Instanz), weil der Polling-Fallback
# mehrere HTTP-Requests einer Sitzung braucht. Events zwischen Instanzen verteilt der Redis-Adapter im Backend.
upstream backend_ws {
    zone backend_ws 64k;
    hash $remote_addr consistent;
    server XXX_backend_load:3000 resolve max_fails=0;
    server XXX_backend_load_replica:3000 resolve max_fails=0;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Hoechstens 64 gleichzeitige schwere Requests am Load Balancer, darueber 503 (Gate je Instanz kommt dazu).
limit_conn_zone $server_name zone=heavy:1m;

server {
    listen 80;

    # media_upload im Loadtest
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 1s;
    # Nur Verbindungsfehler zaehlen gegen max_fails und werden wiederholt, kein Timeout: unter Ueberlast ueberschreiten
    # Requests das Lese-Timeout, das warf sonst Instanz um Instanz aus dem Pool (502 "no live upstreams") und
    # wiederholte GETs, also doppelte Last genau im falschen Moment.
    proxy_next_upstream error;
    add_header X-Upstream $upstream_addr always;

    # WebSocket-Upgrade durchreichen (vorher setzte der Server-Block Connection "" und das Upgrade ging verloren).
    # Eigene proxy_set_header heben die geerbten auf, deshalb hier vollstaendig.
    location /socket.io/ {
        proxy_pass http://backend_ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location ~ ^/api/v1/(profile/search|discover/deck|admin/users|admin/dashboard/.+|admin/owner/.+|admin/shop/(attention|products|orders|cases)|admin/shop/invoices/[^/]+/pdf|chat/requests|chat/conversations/[^/]+/messages)$ {
        proxy_pass http://backend_heavy;
        proxy_read_timeout 15s;
        limit_conn heavy 64;
    }

    # bcrypt: Login auf eigenen Auth-Pool — isoliert CPU-Last von Fast- und Heavy-Instanzen.
    location ~ ^/api/v1/auth/(login|register|reset-password|change-password)$ {
        proxy_pass http://backend_auth;
        proxy_read_timeout 10s;
    }

    location ~ ^/api/v1/(media/upload/|profile/audio$) {
        proxy_pass http://backend_fast;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://backend_fast;
        proxy_read_timeout 5s;
        # nginx wiederholt POST/PUT/PATCH/DELETE von sich aus nicht (non_idempotent fehlt mit Absicht)
        proxy_next_upstream error http_502;
        proxy_next_upstream_tries 2;
    }
}
