# Pinned explicitly so the Compose project name doesn't drift when the repo
# folder gets renamed (it already has once — see commit c364412). Compose
# defaults the project name to the current directory's name; a stale/renamed
# directory then makes `docker compose up` treat already-running containers
# as belonging to a different project, try to recreate them, and collide on
# their fixed container_name. Must match the label already on the running
# containers (`docker inspect <name> --format '{{index .Config.Labels
# "com.docker.compose.project"}}'`) or compose creates a second, empty set
# of volumes alongside the real ones instead of reusing them.
name: whitelabel-saas---comunity-plattform-

services:

  XXX_db:
    build:
      context: ./backend
      dockerfile: db/Dockerfile
    image: xxx_db:local
    container_name: XXX_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - XXX_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_network

  redis:
    image: redis:7-alpine
    container_name: XXX_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: XXX_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - XXX_db
    networks:
      - XXX_network
    volumes:
      - XXX_pgadmin_data:/var/lib/pgadmin

  nestjs:
    build:
      context: ./backend
    container_name: XXX_backend
    restart: unless-stopped
    environment:
      DB_HOST:     XXX_db
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      JWT_SECRET:  ${JWT_SECRET}
      DEMO_MEDIA_PATH: /app
      SEED_USERS:  ${SEED_USERS:-50}
      SEED_TX_PER_USER: ${SEED_TX_PER_USER:-20}
      SEED_MEDIA_PER_USER: ${SEED_MEDIA_PER_USER:-3}
      SEED_RESET:  ${SEED_RESET:-false}
    ports:
      - "3000:3000"
    depends_on:
      XXX_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - XXX_network

  nextjs:
    build:
      context: ./frontend
    container_name: XXX_frontend
    restart: unless-stopped
    environment:
      # NEXT_PUBLIC_* stay browser-facing (localhost, published port) — set in frontend/.env.
      # Only the server-to-server URL needs the docker-internal service name.
      BACKEND_INTERNAL_URL: http://nestjs:3000
    ports:
      - "3001:3001"
    depends_on:
      - nestjs
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - XXX_network

volumes:
  XXX_pgdata:
  XXX_pgadmin_data:

networks:
  XXX_network:
    driver: bridge