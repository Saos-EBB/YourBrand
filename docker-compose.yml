# Pinned explicitly so the Compose project name doesn't drift when the repo
# folder gets renamed (it already has once — see commit c364412). Compose
# defaults the project name to the current directory's name; a stale/renamed
# directory then makes `docker compose up` treat already-running containers
# as belonging to a different project, try to recreate them, and collide on
# their fixed container_name. Must match the label already on the running
# containers (`docker inspect <name> --format '{{index .Config.Labels
# "com.docker.compose.project"}}'`) or compose creates a second, empty set
# of volumes alongside the real ones instead of reusing them.
name: whitelabel-saas---comunity-plattform-

services:

  XXX_db:
    build:
      context: ./backend
      dockerfile: db/Dockerfile
    image: xxx_db:local
    container_name: XXX_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - XXX_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_network

  redis:
    image: redis:7-alpine
    container_name: XXX_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_network

  minio:
    image: minio/minio:latest
    container_name: XXX_minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - XXX_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_network

  # Einmal-Container: legt den Bucket an und setzt ihn auf oeffentlich lesbar,
  # dann beendet er sich (kein restart-Loop). MC_HOST_local konfiguriert den
  # mc-Alias direkt ueber Env-Var, kein separates "mc alias set" noetig.
  minio-init:
    image: minio/mc:latest
    container_name: XXX_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint: ["/bin/sh", "-c", "mc mb -p local/yourbrand-media && mc anonymous set download local/yourbrand-media"]
    networks:
      - XXX_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: XXX_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - XXX_db
    networks:
      - XXX_network
    volumes:
      - XXX_pgadmin_data:/var/lib/pgadmin

  nestjs:
    build:
      context: ./backend
    container_name: XXX_backend
    restart: unless-stopped
    environment:
      DB_HOST:     XXX_db
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST:  redis
      REDIS_PORT:  6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION:   auto
      S3_ACCESS_KEY_ID:     ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET:   yourbrand-media
      S3_PUBLIC_URL_BASE: http://localhost:9000/yourbrand-media
      JWT_SECRET:  ${JWT_SECRET}
      DEMO_MEDIA_PATH: /app
      SEED_USERS:  ${SEED_USERS:-50}
      SEED_TX_PER_USER: ${SEED_TX_PER_USER:-20}
      SEED_MEDIA_PER_USER: ${SEED_MEDIA_PER_USER:-3}
      SEED_RESET:  ${SEED_RESET:-false}
    ports:
      - "3000:3000"
    depends_on:
      XXX_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - XXX_network

  nextjs:
    build:
      context: ./frontend
    container_name: XXX_frontend
    restart: unless-stopped
    environment:
      # NEXT_PUBLIC_* stay browser-facing (localhost, published port) — set in frontend/.env.
      # Only the server-to-server URL needs the docker-internal service name.
      BACKEND_INTERNAL_URL: http://nestjs:3000
    ports:
      - "3001:3001"
    depends_on:
      - nestjs
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - XXX_network

volumes:
  XXX_pgdata:
  XXX_pgadmin_data:
  XXX_minio_data:

networks:
  XXX_network:
    driver: bridge