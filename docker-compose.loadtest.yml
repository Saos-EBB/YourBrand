# Loadtest-Stack als Override, NICHT als Ersatz fuer docker-compose.yml.
# docker-compose.yml (Demo) bleibt unveraendert — diese Datei wird zusaetzlich
# geladen und fuegt neue Services hinzu, ueberschreibt keinen Demo-Service.
#
# Start (Demo- und Loadtest-Stack zusammen, im selben Compose-Projekt):
#   docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d \
#     XXX_db_load XXX_redis_load minio-load minio-load-init XXX_worker_load XXX_backend_load pgadmin
#
# Eigenes DB-Volume (XXX_load_pgdata), eigenes Redis (XXX_redis_load), eigenes
# MinIO (minio-load), ein eigener Worker (XXX_worker_load) und ein eigenes
# Netzwerk (XXX_load_network) — die Demo-DB/-Redis/-MinIO/-Worker/das
# Demo-Volume/-Netzwerk werden nie beruehrt.
#
# pgAdmin-Zugriff auf die Loadtest-DB: der bestehende `pgadmin`-Service (siehe
# docker-compose.yml) wird hier NICHT neu definiert, sondern per Compose-Merge
# nur um eine zusaetzliche Netzwerk-Mitgliedschaft (XXX_load_network) erweitert.
# Dadurch sieht pgAdmin XXX_db_load per Docker-DNS unter dem Container-Namen
# und dem INTERNEN Port 5432 — z.B. neue Server-Verbindung in pgAdmin:
#   Host: XXX_db_load   Port: 5432
# NICHT localhost:5532 (das ist nur der Host-Port fuer externe Clients wie
# DBeaver, den pgAdmin von innerhalb seines eigenen Containers aus so nicht
# erreicht).
#
# Auto-Seed: docker-entrypoint.sh (bereits vorhanden, unveraendert) ruft
# seed-extra-users.ts idempotent mit SEED_USERS auf — kein manueller
# ts-node-Aufruf noetig, einfach SEED_USERS beim `docker compose up` setzen
# (gleicher Variablenname wie im Demo-Stack, gilt hier nur fuer XXX_backend_load).
# SEED_TX_PER_USER/SEED_MEDIA_PER_USER bleiben 0, weil der Loadtest seine
# Coin-Historie selbst live erzeugt (POST /hidden/coin/test-purchase).

services:

  XXX_db_load:
    build:
      context: ./backend
      dockerfile: db/Dockerfile
    image: xxx_db_load:local
    container_name: XXX_db_load
    restart: unless-stopped
    # Default max_connections=100 reicht nicht fuer mehrere Backend-Instanzen
    # (je DB_POOL_MAX=20) + Worker + pgAdmin/Seeds.
    command: postgres -c max_connections=300
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5532:5432"
    volumes:
      - XXX_load_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_load_network

  XXX_redis_load:
    image: redis:7-alpine
    container_name: XXX_redis_load
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_load_network

  minio-load:
    image: minio/minio:latest
    container_name: minio-load
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9500:9000"
    volumes:
      - XXX_load_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_load_network

  minio-load-init:
    image: minio/mc:latest
    container_name: minio-load-init
    depends_on:
      minio-load:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio-load:9000
    entrypoint: ["/bin/sh", "-c", "mc mb -p local/yourbrand-media-load && mc anonymous set download local/yourbrand-media-load"]
    networks:
      - XXX_load_network

  XXX_backend_load:
    build:
      context: ./backend
    image: xxx_backend_load:local
    container_name: XXX_backend_load
    restart: unless-stopped
    environment: &backend_load_env
      DB_HOST:     XXX_db_load
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      # Schnelle Routen: Abfrage nach 2 s abbrechen (503), die heavy-Gruppe ueberschreibt das mit 10 s.
      DB_STATEMENT_TIMEOUT_MS: 2000
      REDIS_HOST:  XXX_redis_load
      REDIS_PORT:  6379
      S3_ENDPOINT: http://minio-load:9000
      S3_REGION:   auto
      S3_ACCESS_KEY_ID:     ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET:   yourbrand-media-load
      S3_PUBLIC_URL_BASE: http://localhost:9500/yourbrand-media-load
      TENANT:      ${TENANT:-default}
      TENANT_DIR:  /tenants
      JWT_SECRET:  ${JWT_SECRET}
      DEMO_MEDIA_PATH: /app
      LOADTEST_MODE: "true"
      # Handshake mit dem Lastgenerator: nur Requests mit X-Loadtest-Key = LOADTEST_KEY sind ohne Limits
      # und bekommen langlebige Tokens. Wert steht in ./.env (mind. 32 Zeichen), Gegenstueck im Loadtest-Repo.
      LOADTEST_KEY: ${LOADTEST_KEY:-}
      LOADTEST_TOKEN_TTL_S: ${LOADTEST_TOKEN_TTL_S:-43200}
      SEED_USERS:  ${SEED_USERS:-5000}
      SEED_TX_PER_USER: 0
      SEED_MEDIA_PER_USER: 0
      SEED_RESET:  ${SEED_RESET:-false}
    # Kein Host-Port mehr — :3100 gehoert jetzt XXX_lb_load (nginx), der auf
    # diese Instanz + alle Replikas verteilt.
    healthcheck: &backend_load_healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      # docker-entrypoint.sh seedet vor dem Start (full-reset + SEED_USERS)
      start_period: 900s
      start_interval: 5s
    depends_on:
      XXX_db_load:
        condition: service_healthy
      XXX_redis_load:
        condition: service_healthy
      minio-load-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./tenants:/tenants:ro
    networks:
      - XXX_load_network

  # Zusaetzliche Backend-Instanzen hinter XXX_lb_load. Anzahl ueber
  # BACKEND_REPLICAS (default 3 -> 4 Instanzen insgesamt mit XXX_backend_load).
  #
  # Starten bewusst NICHT ueber docker-entrypoint.sh: Seeds/full-reset laufen
  # nur einmal in XXX_backend_load, und erst wenn der healthy ist. Und sie
  # starten `node dist/main` statt `nest start --watch`, weil alle Instanzen
  # dasselbe ./backend mounten — mehrere Watch-Compiler wuerden sich in
  # /app/dist gegenseitig ueberschreiben. dist/ baut XXX_backend_load; nach
  # Code-Aenderungen die Replikas neu starten (Dashboard "Reset backend"
  # macht das mit).
  #
  # Bekannte Grenzen (fuer den HTTP-Loadtest egal): Socket.io-Gateways haben
  # keinen Redis-Adapter, Events erreichen nur Clients derselben Instanz; und
  # die @Cron-Jobs (last-active flush jede Minute, pseudonymization 02:00)
  # laufen in jeder Instanz.
  XXX_backend_load_replica:
    image: xxx_backend_load:local
    restart: unless-stopped
    command: ["node", "dist/main"]
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}
    environment:
      <<: *backend_load_env
      SEED_USERS: 0
      RUN_CRONS: "false"   # Crons laufen nur in XXX_backend_load
    healthcheck:
      <<: *backend_load_healthcheck
      start_period: 120s
    depends_on:
      XXX_backend_load:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./tenants:/tenants:ro
    networks:
      - XXX_load_network

  # Eigene Instanzen fuer die schweren Routen (Suche, Deck, Admin-Listen, siehe nginx-lb.conf), damit sie den
  # Event-Loop der schnellen Routen nicht blockieren. Gleiches Image und dist/ wie die Replikas.
  XXX_backend_load_heavy:
    image: xxx_backend_load:local
    restart: unless-stopped
    command: ["node", "dist/main"]
    deploy:
      replicas: ${BACKEND_HEAVY_REPLICAS:-2}
    environment:
      <<: *backend_load_env
      SEED_USERS: 0
      DB_STATEMENT_TIMEOUT_MS: 10000
      RUN_CRONS: "false"   # Crons laufen nur in XXX_backend_load
    healthcheck:
      <<: *backend_load_healthcheck
      start_period: 120s
    depends_on:
      XXX_backend_load:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./tenants:/tenants:ro
    networks:
      - XXX_load_network

  # Load Balancer auf :3100 (dort, wo frueher XXX_backend_load direkt lag) —
  # Loadtest-Skripte und Dashboard bleiben unveraendert. Zwei Upstreams (fast/heavy),
  # Servicenamen werden alle 10 s neu aufgeloest (nginx-lb.conf).
  XXX_lb_load:
    image: nginx:1.27-alpine
    container_name: XXX_lb_load
    restart: unless-stopped
    ports:
      - "3100:80"
    volumes:
      - ./backend/scripts/loadtest/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      XXX_backend_load:
        condition: service_healthy
      XXX_backend_load_replica:
        condition: service_healthy
      XXX_backend_load_heavy:
        condition: service_healthy
    networks:
      - XXX_load_network

  XXX_worker_load:
    build:
      context: ./backend
    image: xxx_worker_load:local
    container_name: XXX_worker_load
    restart: unless-stopped
    command: npm run start:worker:dev
    environment:
      DB_HOST:     XXX_db_load
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      REDIS_HOST:  XXX_redis_load
      REDIS_PORT:  6379
      S3_ENDPOINT: http://minio-load:9000
      S3_REGION:   auto
      S3_ACCESS_KEY_ID:     ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET:   yourbrand-media-load
      S3_PUBLIC_URL_BASE: http://localhost:9500/yourbrand-media-load
      TENANT:      ${TENANT:-default}
      TENANT_DIR:  /tenants
    depends_on:
      XXX_db_load:
        condition: service_healthy
      XXX_redis_load:
        condition: service_healthy
      minio-load-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./tenants:/tenants:ro
    networks:
      - XXX_load_network

  # Nicht neu definiert — nur um eine zweite Netzwerk-Mitgliedschaft erweitert,
  # damit das bestehende Demo-pgAdmin auch XXX_db_load per Container-DNS sieht.
  # Alle anderen Felder (image, container_name, environment, ports, volumes)
  # bleiben die aus docker-compose.yml.
  pgadmin:
    networks:
      - XXX_load_network

networks:
  XXX_load_network:
    driver: bridge

volumes:
  XXX_load_pgdata:
  XXX_load_minio_data:
