# Loadtest-Stack als Override, NICHT als Ersatz fuer docker-compose.yml.
# docker-compose.yml (Demo) bleibt unveraendert — diese Datei wird zusaetzlich
# geladen und fuegt neue Services hinzu, ueberschreibt keinen Demo-Service.
#
# Start (Demo- und Loadtest-Stack zusammen, im selben Compose-Projekt):
#   docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d \
#     XXX_db_load XXX_redis_load XXX_minio_load XXX_minio_load_init XXX_worker_load XXX_backend_load pgadmin
#
# Eigenes DB-Volume (XXX_load_pgdata), eigenes Redis (XXX_redis_load), eigenes
# MinIO (XXX_minio_load), ein eigener Worker (XXX_worker_load) und ein eigenes
# Netzwerk (XXX_load_network) — die Demo-DB/-Redis/-MinIO/-Worker/das
# Demo-Volume/-Netzwerk werden nie beruehrt.
#
# pgAdmin-Zugriff auf die Loadtest-DB: der bestehende `pgadmin`-Service (siehe
# docker-compose.yml) wird hier NICHT neu definiert, sondern per Compose-Merge
# nur um eine zusaetzliche Netzwerk-Mitgliedschaft (XXX_load_network) erweitert.
# Dadurch sieht pgAdmin XXX_db_load per Docker-DNS unter dem Container-Namen
# und dem INTERNEN Port 5432 — z.B. neue Server-Verbindung in pgAdmin:
#   Host: XXX_db_load   Port: 5432
# NICHT localhost:5532 (das ist nur der Host-Port fuer externe Clients wie
# DBeaver, den pgAdmin von innerhalb seines eigenen Containers aus so nicht
# erreicht).
#
# Auto-Seed: docker-entrypoint.sh (bereits vorhanden, unveraendert) ruft
# seed-extra-users.ts idempotent mit SEED_USERS auf — kein manueller
# ts-node-Aufruf noetig, einfach SEED_USERS beim `docker compose up` setzen
# (gleicher Variablenname wie im Demo-Stack, gilt hier nur fuer XXX_backend_load).
# SEED_TX_PER_USER/SEED_MEDIA_PER_USER bleiben 0, weil der Loadtest seine
# Coin-Historie selbst live erzeugt (POST /hidden/coin/test-purchase).

services:

  XXX_db_load:
    build:
      context: ./backend
      dockerfile: db/Dockerfile
    image: xxx_db_load:local
    container_name: XXX_db_load
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5532:5432"
    volumes:
      - XXX_load_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_load_network

  XXX_redis_load:
    image: redis:7-alpine
    container_name: XXX_redis_load
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_load_network

  XXX_minio_load:
    image: minio/minio:latest
    container_name: XXX_minio_load
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9500:9000"
    volumes:
      - XXX_load_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - XXX_load_network

  XXX_minio_load_init:
    image: minio/mc:latest
    container_name: XXX_minio_load_init
    depends_on:
      XXX_minio_load:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@XXX_minio_load:9000
    entrypoint: ["/bin/sh", "-c", "mc mb -p local/yourbrand-media-load && mc anonymous set download local/yourbrand-media-load"]
    networks:
      - XXX_load_network

  XXX_backend_load:
    build:
      context: ./backend
    image: xxx_backend_load:local
    container_name: XXX_backend_load
    restart: unless-stopped
    environment:
      DB_HOST:     XXX_db_load
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      REDIS_HOST:  XXX_redis_load
      REDIS_PORT:  6379
      S3_ENDPOINT: http://XXX_minio_load:9000
      S3_REGION:   auto
      S3_ACCESS_KEY_ID:     ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET:   yourbrand-media-load
      S3_PUBLIC_URL_BASE: http://localhost:9500/yourbrand-media-load
      JWT_SECRET:  ${JWT_SECRET}
      DEMO_MEDIA_PATH: /app
      LOADTEST_MODE: "true"
      SEED_USERS:  ${SEED_USERS:-5000}
      SEED_TX_PER_USER: 0
      SEED_MEDIA_PER_USER: 0
      SEED_RESET:  ${SEED_RESET:-false}
    ports:
      - "3100:3000"
    depends_on:
      XXX_db_load:
        condition: service_healthy
      XXX_redis_load:
        condition: service_healthy
      XXX_minio_load_init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - XXX_load_network

  XXX_worker_load:
    build:
      context: ./backend
    image: xxx_worker_load:local
    container_name: XXX_worker_load
    restart: unless-stopped
    command: npm run start:worker:dev
    environment:
      DB_HOST:     XXX_db_load
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      REDIS_HOST:  XXX_redis_load
      REDIS_PORT:  6379
      S3_ENDPOINT: http://XXX_minio_load:9000
      S3_REGION:   auto
      S3_ACCESS_KEY_ID:     ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET:   yourbrand-media-load
      S3_PUBLIC_URL_BASE: http://localhost:9500/yourbrand-media-load
    depends_on:
      XXX_db_load:
        condition: service_healthy
      XXX_redis_load:
        condition: service_healthy
      XXX_minio_load_init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - XXX_load_network

  # Nicht neu definiert — nur um eine zweite Netzwerk-Mitgliedschaft erweitert,
  # damit das bestehende Demo-pgAdmin auch XXX_db_load per Container-DNS sieht.
  # Alle anderen Felder (image, container_name, environment, ports, volumes)
  # bleiben die aus docker-compose.yml.
  pgadmin:
    networks:
      - XXX_load_network

networks:
  XXX_load_network:
    driver: bridge

volumes:
  XXX_load_pgdata:
  XXX_load_minio_data:
